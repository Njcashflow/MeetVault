<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MeetVault</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 300px;
      padding: 16px;
      background: #090a0f;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      flex-direction: column;
    }
    .version {
      font-size: 11px;
      color: #10b981;
      font-weight: 500;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
      margin-bottom: 12px;
    }
    .dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 6px #10b981;
    }
    p {
      font-size: 12px;
      color: #a1a1aa;
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      background: linear-gradient(135deg, #10b981 0%, #06b6d4 100%);
      color: #ffffff;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }
    .btn:hover {
      opacity: 0.92;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="MeetVault Logo" class="logo" />
    <div class="title">
      <span>MeetVault</span>
      <span class="version">Offline Transcriber v1.0.0</span>
    </div>
  </div>

  <div class="badge">
    <span class="dot"></span>
    <span>Active & Ready</span>
  </div>

  <p>
    MeetVault automatically runs on Google Meet. Join any call and the floating HUD with the GPU-Accelerated Aurora Plasma Bar will appear.
  </p>

  <button class="btn" id="open-meet">Open Google Meet</button>

  <script src="popup.js"></script>
</body>
</html>
